<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' https://api.github.com; frame-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Sign in</title>
<link rel="icon" href="data:,">
<style id="lock-style">
  :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #1c2430; --card: #fff; --line: #dde2e8; --accent: #2f5d8a; --bad: #b03a2e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12161c; --fg: #e6eaf0; --card: #1a2028; --line: #2e3844; --accent: #7fb0e0; --bad: #f08a7e; } }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; width: 100%; max-width: 320px;
    display: flex; flex-direction: column; gap: 10px; }
  form[hidden] { display: none; }
  label { font-weight: 600; font-size: .92rem; }
  input[type=password] { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
  .keep { font-weight: 400; display: flex; gap: 8px; align-items: center; font-size: .88rem; }
  button { font: inherit; font-weight: 600; padding: 9px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  #msg { min-height: 1.2em; margin: 0; font-size: .88rem; color: var(--bad); }
</style>
<script src="u.js" defer></script>
</head>
<body>
<form id="lock" hidden autocomplete="off">
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <label class="keep"><input id="keep" type="checkbox" checked> Stay unlocked in this tab</label>
  <button type="submit">Unlock</button>
  <p id="msg" role="alert"></p>
</form>
</body>
</html>
